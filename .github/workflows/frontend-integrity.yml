name: Frontend integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Referenced scripts exist + cache key present
        run: python3 scripts/integrity_check.py
      - name: JS syntax (all root scripts)
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Mi espacio identity and shell contract
        run: node --test tests/mi-espacio-phase1.test.cjs
      - name: Clinician access to Mi espacio
        run: node --test tests/mi-espacio-clinician-access.test.cjs
      - name: Mi espacio activity adapter (phase 2)
        run: node --test tests/mi-espacio-phase2.test.cjs
      - name: Mi espacio Phase 3 regression
        run: node --test tests/mi-espacio-phase3.test.cjs
      - name: Mi espacio Phase 4 regression
        run: node --test tests/mi-espacio-phase4.test.cjs
      - name: Mi espacio Phase 5 regression
        run: node --test tests/mi-espacio-phase5.test.cjs
      - name: Mi espacio Phase 6A personal guardias contract
        run: node --test tests/mi-espacio-phase6a.test.cjs
      - name: Mi espacio Phase 6B personal portfolio
        run: node --test tests/mi-espacio-phase6b.test.cjs
      - name: Mi espacio Phase 6C verified review outcomes
        run: node --test tests/mi-espacio-phase6c.test.cjs
      - name: Mi espacio Phase 6D interaction integrity
        run: node --test tests/mi-espacio-phase6d.test.cjs
      - name: Mi espacio Phase 7A composition contract
        run: node --test tests/mi-espacio-phase7a.test.cjs
      - name: Mi espacio Phase 7B inline detail contract
        run: node --test tests/mi-espacio-phase7b.test.cjs
      - name: Mi espacio Phase 9 approved visual direction
        run: node --test tests/mi-espacio-phase9.test.cjs
      - name: Mi espacio Phase 10A cross-profile relevance
        run: node --test tests/mi-espacio-phase10a.test.cjs
      - name: Mi espacio Phase 10B scholarly hierarchy
        run: node --test tests/mi-espacio-phase10b.test.cjs
      - name: Mi espacio Phase 10D account isolation and layout
        run: node --test tests/mi-espacio-phase10d.test.cjs
      - name: Mi espacio Phase 12B adaptive role-neutral priority
        run: node --test tests/mi-espacio-phase12b.test.cjs
      - name: Mi espacio Phase 13B review attention contract
        run: node --test tests/mi-espacio-phase13b.test.cjs
      - name: Mi espacio Phase 14B interaction polish contract
        run: node --test tests/mi-espacio-phase14b.test.cjs
      - name: Mi espacio Phase 26A workspace navigation contract
        run: node --test tests/mi-espacio-phase26a.test.cjs
      - name: Mi espacio Phase 26B contextual workspace contract
        run: node --test tests/mi-espacio-phase26b.test.cjs
      - name: Mi espacio Phase 26C professional profile workspace
        run: node --test tests/mi-espacio-phase26c.test.cjs
      - name: Mi espacio Phase 26D contextual professional activity
        run: node --test tests/mi-espacio-phase26d.test.cjs
      - name: Mi espacio Phase 26E design system consistency
        run: node --test tests/mi-espacio-phase26e.test.cjs
      - name: Mi espacio Phase 26F permission and acceptance gates
        run: node --test tests/mi-espacio-phase26f.test.cjs
      - name: Mi espacio Phase 26G duty navigation
        run: node --test tests/mi-espacio-phase26g.test.cjs
      - name: Mi espacio cache-key bump guard
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --quiet
          if ! git diff --quiet "$BASE" -- mi-espacio/; then
            old=$(git show "$BASE:index.html" | grep -oE 'mi-espacio/mi-espacio\.js\?v=[^"]+' | head -1)
            new=$(grep -oE 'mi-espacio/mi-espacio\.js\?v=[^"]+' index.html | head -1)
            echo "mi-espacio/ changed. cache key: '$old' -> '$new'"
            if [ "$old" = "$new" ]; then
              echo "::error::mi-espacio/ was modified but its ?v= cache key in index.html was not bumped."
              exit 1
            fi
          fi
      - name: Access script cache-key bump guard
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --quiet
          if ! git diff --quiet "$BASE" -- access.js; then
            old=$(git show "$BASE:index.html" | grep -oE 'access\.js\?v=[^"]+' | head -1)
            new=$(grep -oE 'access\.js\?v=[^"]+' index.html | head -1)
            if [ "$old" = "$new" ]; then
              echo "::error::access.js changed but its index.html cache key did not."
              exit 1
            fi
          fi
      - name: Cache-key bump guard
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --quiet
          if git diff --quiet "$BASE" -- app.js; then
            echo "app.js unchanged vs $BASE — cache-key guard not applicable."
          else
            old=$(git show "$BASE:index.html" | grep -oE 'app\.js\?v=[^"]+' | head -1)
            new=$(grep -oE 'app\.js\?v=[^"]+' index.html | head -1)
            echo "app.js changed. cache key: '$old' -> '$new'"
            if [ "$old" = "$new" ]; then
              echo "::error::app.js was modified but its ?v= cache key was not bumped in index.html. Browsers would keep serving the old bundle."
              exit 1
            fi
          fi
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -D @playwright/test@1.47.2 http-server vue@3.4.21 && npx playwright install --with-deps chromium
      - name: Settings component structure and Vue template compilation
        run: node tests/settings-ui-integrity.cjs
      - name: Mi espacio template compiles
        run: node tests/mi-espacio-template.cjs
      - run: npx playwright test
